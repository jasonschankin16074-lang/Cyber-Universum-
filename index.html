<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Universe v31.0 - Blackscreen & Blitzeffekt</title>
  <style>
    :root {
      --bg: #030508;
      --card-bg: #090d14;
      --border: #1a2333;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --accent-main: #10b981;
      --accent-red: #ef4444;
      --accent-yellow: #f59e0b;
      --dash-bg: #020407;
    }

    body.theme-good {
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent-main: #2563eb;
      --dash-bg: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 15px; transition: 0.3s; }

    .rainbow-text { animation: rainbow 3s linear infinite; }
    @keyframes rainbow {
      0% { color: #ff0000; } 20% { color: #ff8800; } 40% { color: #ffff00; }
      60% { color: #00ff00; } 80% { color: #00ffff; } 100% { color: #ff00ff; }
    }

    .start-dashboard {
      max-width: 900px; margin: 0 auto; background: var(--card-bg);
      border: 2px solid var(--accent-main); border-radius: 12px; padding: 20px;
    }

    .faction-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
    .faction-card {
      border: 2px solid var(--border); border-radius: 8px; padding: 15px;
      text-align: center; cursor: pointer; transition: 0.2s; background: rgba(0,0,0,0.03);
    }
    .faction-card.active-evil { border-color: var(--accent-red); background: rgba(239, 68, 68, 0.1); }
    .faction-card.active-good { border-color: #2563eb; background: rgba(37, 99, 235, 0.1); }

    .launch-btn {
      width: 100%; background: var(--accent-main); color: #fff; border: none;
      padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer;
    }

    #hackerOverlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.95); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; padding: 10px;
    }

    body.theme-good #hackerOverlay { background: rgba(248, 250, 252, 0.96); }
    #matrixCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.15; }

    .dash-window {
      position: relative; z-index: 2; width: 98vw; height: 96vh;
      background: var(--dash-bg); border: 2px solid var(--accent-main);
      border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; color: var(--text);
      transition: background 0.1s, opacity 0.2s;
    }

    .dash-header {
      background: rgba(0, 0, 0, 0.2); padding: 8px 14px; border-bottom: 1px solid var(--accent-main);
      display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: bold;
    }

    .header-controls { display: flex; align-items: center; gap: 8px; }

    .dash-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .content-area { padding: 10px; display: flex; flex-direction: column; gap: 10px; height: 100%; width: 100%; }
    .chat-box { flex: 1; border: 1px solid var(--border); background: var(--card-bg); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; overflow: hidden; }
    .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; font-size: 11px; font-family: monospace; white-space: pre-wrap; word-break: break-all; }

    .interactive-container {
      display: none; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
    }
    .action-input {
      flex: 1; background: rgba(0,0,0,0.3); border: 1px solid var(--accent-main);
      color: var(--text); padding: 8px; border-radius: 4px; font-size: 14px; outline: none;
    }
    .action-btn {
      background: var(--accent-main); color: #fff; border: none; padding: 8px 16px;
      font-weight: bold; border-radius: 4px; cursor: pointer;
    }

    .close-btn { background: transparent; border: 1px solid var(--accent-red); color: var(--accent-red); padding: 2px 8px; cursor: pointer; border-radius: 4px; }
    
    .admin-burger-btn {
      background: transparent; border: 1px solid var(--border); color: var(--text-muted);
      padding: 2px 10px; cursor: pointer; border-radius: 4px; font-size: 14px; transition: 0.2s;
    }
    .admin-burger-btn:hover { color: var(--accent-yellow); border-color: var(--accent-yellow); }

    .admin-modal {
      display: none; position: absolute; top: 40px; right: 10px; z-index: 10000;
      background: var(--card-bg); border: 2px solid var(--accent-yellow);
      border-radius: 8px; padding: 15px; width: 280px; box-shadow: 0 0 15px rgba(0,0,0,0.8);
    }
    .admin-modal h4 { color: var(--accent-yellow); margin-bottom: 10px; font-size: 12px; text-align: center; }
    .admin-modal select, .admin-modal input {
      width: 100%; padding: 6px; margin-bottom: 10px; background: rgba(0,0,0,0.5);
      border: 1px solid var(--border); color: var(--text); border-radius: 4px; font-size: 12px;
    }
    .admin-modal button {
      width: 100%; background: var(--accent-yellow); color: #000; border: none;
      padding: 6px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 12px;
    }

    /* BLACKSCREEN & BLITZEFFEKT OVERLAY */
    #blackscreenOverlay {
      display: none;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000000;
      z-index: 99999;
      color: #00ff66;
      font-size: 14px;
      padding: 20px;
      box-sizing: border-box;
      flex-direction: column;
      justify-content: flex-end;
    }

    /* Blitz-Effekt Animationen */
    .flash-white {
      animation: flashAnim 0.15s ease-in-out infinite alternate;
    }
    @keyframes flashAnim {
      0% { background-color: #000000; }
      50% { background-color: #ffffff; }
      100% { background-color: #00ffff; }
    }
  </style>
</head>

        <h3 style="color: #2563eb;">🛡️ GUTE SEITE (15 PHASEN ABWEHR)</h3>
        <p style="font-size: 11px; color: var(--text-muted); margin-top: 5px;">Verhindere den Großangriff!</p>
      </div>
    </div>

    <button class="launch-btn" onclick="launchTerminal()">>_ OVERRIDE TERMINAL STARTEN</button>
  </div>
