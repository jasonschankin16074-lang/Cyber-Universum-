<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Soundboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 2.5rem;
            color: #00e676;
            text-shadow: 0 0 10px rgba(0, 230, 118, 0.3);
        }

        .soundboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            max-width: 600px;
            width: 90%;
        }

        .btn {
            background: #1e1e1e;
            color: #fff;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 25px 15px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .btn:hover {
            border-color: #00e676;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 230, 118, 0.2);
        }

        .btn:active {
            transform: translateY(1px);
            background: #00e676;
            color: #000;
        }
    </style>
</head>
<body>

    <h1>🔊 Soundboard</h1>

    <div class="soundboard">
        <button class="btn" onclick="playSound('btn1')">Sound 1</button>
        <button class="btn" onclick="playSound('btn2')">Sound 2</button>
        <button class="btn" onclick="playSound('btn3')">Sound 3</button>
        <button class="btn" onclick="playSound('btn4')">Sound 4</button>
    </div>

    <!-- Audio Elemente (Später eigene MP3-Links eintragen) -->
    <audio id="btn1" src="https://www.soundjay.com/buttons/sounds/button-1.mp3"></audio>
    <audio id="btn2" src="https://www.soundjay.com/buttons/sounds/button-2.mp3"></audio>
    <audio id="btn3" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>
    <audio id="btn4" src="https://www.soundjay.com/buttons/sounds/button-4.mp3"></audio>

    <script>
        function playSound(id) {
            const audio = document.getElementById(id);
            if (audio) {
                audio.currentTime = 0;
                audio.play();
            }
        }
    </script>

</body>
</html>
